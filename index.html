<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dice Roll Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <div id="cont">
            <h1>Dice Roll</h1>
            <p>Click the Roll button to roll three dice</p>
            <div class="dice-container">
                <label id="one" aria-label="First die"></label>
                <label id="two" aria-label="Second die"></label>
                <label id="three" aria-label="Third die"></label>
            </div>
            <div id="total-container">
                <span>Total: </span>
                <label id="total">0</label>
            </div>
            <button type="button" id="button" aria-label="Roll dice">Roll</button>
        </div>
    </main>
    <script src="index.js" type="text/javascript"></script>
</body>
</html>
